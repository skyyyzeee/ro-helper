# A tag «v1.2.3» builds the Windows installer, signs the update and puts both, with latest.json for the
# app's updater, into a draft release whose notes come from CHANGELOG.md. Check the draft and publish it:
# installed copies see the new version only once the release is published.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The tag names the version the release is published under; the app reports the one in package.json.
      - name: Tag matches package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match package.json ($version). Set the version with npm version, commit, then tag that commit."
            exit 1
          fi

      # «Что нового» of this version from CHANGELOG.md: its «## 1.2.3» section, up to the next one.
      - name: Release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="## $version" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md | sed -e '/./,$!d')
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no «## $version» section: write what is new before tagging."
            exit 1
          fi
          { echo "version=$version"; echo 'body<<NOTES_END'; echo "$notes"; echo 'NOTES_END'; } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Tests
        run: npm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The key that signs updates; the app accepts only updates signed with it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: РО Хелпер ${{ github.ref_name }}
          releaseBody: |
            ## Что нового

            ${{ steps.notes.outputs.body }}

            ## Установка

            Скачайте `RO-Helper_${{ steps.notes.outputs.version }}_x64-setup.exe` ниже и запустите. Установщик без цифровой подписи, поэтому Windows может показать «Windows защитила ваш компьютер» — нажмите «Подробнее» → «Выполнить в любом случае».

            Уже установленная программа предложит обновиться сама.
          releaseDraft: true
          releaseAssetNamePattern: RO-Helper_[version]_[arch][setup][ext]
          updaterJsonPreferNsis: true
